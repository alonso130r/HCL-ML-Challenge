<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f9">
    <title>Local conversation</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="section-kicker">LOCAL RUNTIME</p>
          <h1>Local conversation</h1>
        </div>
        <div class="runtime-status"><span></span> Stream ready</div>
      </header>

      <section class="panel output-panel" aria-live="polite">
        <div class="panel-header">
          <div><p class="panel-label">OUTPUT</p><h2>Response stream</h2></div>
          <span class="panel-meta" id="stream-state">IDLE</span>
        </div>
        <div class="conversation">
          <div class="intro" id="intro">
            <div class="empty-mark"><span></span><span></span><span></span></div>
            <h3>No response yet</h3>
            <p>Type a message or record a voice note. Everything stays on this machine.</p>
          </div>
          <div class="messages" id="messages"></div>
        </div>
      </section>

      <section class="composer" aria-label="Message composer">
        <div class="signal-row">
          <div class="emotion-panel">
            <div class="emotion-readout" id="emotion-readout">
              <span class="emotion-dot"></span><span>No audio analyzed</span>
            </div>
            <div class="emotion-diagnostic" id="emotion-diagnostic"></div>
          </div>
          <span class="transport-label">LOCAL AUDIO + STREAM</span>
        </div>
        <div class="input-row">
          <button class="record-button" id="record-button" type="button" aria-pressed="false" aria-label="Start recording">
            <span class="mic-icon" aria-hidden="true"></span>
          </button>
          <label class="message-field">
            <span class="sr-only">Your message</span>
            <textarea id="message-input" rows="1" maxlength="1000" placeholder="Enter a message for inference..."></textarea>
          </label>
          <button class="send-button" id="send-button" type="button" aria-label="Send message">
            <span aria-hidden="true">↑</span>
          </button>
        </div>
        <div class="composer-footer">
          <span id="status-text">Ready</span>
          <span>Record to transcribe · Enter to send · Shift + Enter for a new line</span>
        </div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
